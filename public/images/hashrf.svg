<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HashRF representation</title>
  <desc id="desc">A scientific illustration of low-rank feature planes, hash cells, and sampled rays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf4f1"/><stop offset="1" stop-color="#f8f4ec"/></linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8d80" stop-opacity=".82"/><stop offset="1" stop-color="#b9d0c8" stop-opacity=".18"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#142e2a" flood-opacity=".12"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#315f55" stroke-opacity=".24" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(170 100)">
    <path d="M0 95 270 0l210 124-270 98z" fill="url(#plane)" stroke="#315f55" stroke-width="2"/><path d="M0 95 270 0l210 124-270 98z" fill="url(#grid)" opacity=".7"/>
    <path d="M40 179 310 84l210 124-270 98z" fill="url(#plane)" stroke="#315f55" stroke-width="2"/><path d="M40 179 310 84l210 124-270 98z" fill="url(#grid)" opacity=".7"/>
    <path d="M80 263 350 168l210 124-270 98z" fill="url(#plane)" stroke="#315f55" stroke-width="2"/><path d="M80 263 350 168l210 124-270 98z" fill="url(#grid)" opacity=".7"/>
    <g fill="#d56c43"><circle cx="240" cy="130" r="9"/><circle cx="325" cy="165" r="7"/><circle cx="365" cy="237" r="10"/><circle cx="185" cy="258" r="7"/><circle cx="420" cy="301" r="8"/></g>
  </g>
  <path d="M65 500c185-95 328-173 510-216 180-43 350-37 566-115" fill="none" stroke="#d56c43" stroke-width="3" stroke-dasharray="8 12" opacity=".8"/>
  <g transform="translate(790 130)"><rect width="260" height="260" rx="22" fill="#153a34"/><g fill="none" stroke="#7fa99c" stroke-opacity=".55"><path d="M0 52h260M0 104h260M0 156h260M0 208h260M52 0v260M104 0v260M156 0v260M208 0v260"/></g><g fill="#f4f0e8"><rect x="54" y="106" width="48" height="48" rx="4"/><rect x="158" y="54" width="48" height="48" rx="4" opacity=".7"/><rect x="106" y="158" width="48" height="48" rx="4" opacity=".45"/></g><circle cx="130" cy="130" r="13" fill="#d56c43"/></g>
  <text x="80" y="82" fill="#153a34" font-family="Arial, sans-serif" font-size="24" letter-spacing="4">HASH × LOW-RANK</text>
  <text x="790" y="430" fill="#315f55" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">COMPACT FEATURE FIELD</text>
</svg>
